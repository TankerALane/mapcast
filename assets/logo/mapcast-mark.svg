<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Mapcast mark. Decoupled Lane Studio brand colours: navy #0E1E2E/#081420, teal #4CD3B6, copper #E0904F, cream #F4F1EA -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E1E2E"/>
      <stop offset="1" stop-color="#081420"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- folded map (tri-fold) -->
  <path d="M88 318 L200 290 L200 426 L88 454 Z" fill="#F4F1EA"/>
  <path d="M200 290 L312 318 L312 454 L200 426 Z" fill="#CFC8B8"/>
  <path d="M312 318 L424 290 L424 426 L312 454 Z" fill="#F4F1EA"/>
  <!-- broadcast arcs -->
  <g fill="none" stroke="#4CD3B6" stroke-width="24" stroke-linecap="round">
    <path d="M322.8 90.3 A104 104 0 0 1 353.7 205.6"/>
    <path d="M349.8 58.2 A146 146 0 0 1 393.2 220.0"/>
    <path d="M189.2 90.3 A104 104 0 0 0 158.3 205.6"/>
    <path d="M162.2 58.2 A146 146 0 0 0 118.8 220.0"/>
  </g>
  <!-- location pin -->
  <path d="M256 376 C 238 340 186 270 186 172 A70 70 0 1 1 326 172 C 326 270 274 340 256 376 Z" fill="#E0904F"/>
  <circle cx="256" cy="170" r="27" fill="#0E1E2E"/>
</svg>
